name: Windows checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build tests -c Release --warnaserror
      - name: Check image operations
        run: dotnet run --project tests -c Release --no-build
      - name: Check layouts and DPI changes
        run: dotnet run --project tests -c Release --no-build -- --layout
      - name: Build release ZIP
        run: ./packaging/Build.ps1
